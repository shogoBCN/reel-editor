# Ya tienes — locked production brief (source clock = her recording).
# Final reel time = source − trim_start (4.0s). Do not retune against the output mp4.

project:
  slug: ya_tienes
  title: Ya tienes — medicina familiar
  brand: dra_angelica
  language: es

source:
  video: source/talking_head.mp4
  transcript: source/transcript.json
  overlays: overlays
  trim_start: 4.0
  talk_end: 89.5

output:
  filename: ya-tienes_final.mp4
  fade_white: 0.70
  endcard_hold: 2.00

captions:
  enabled: true
  asr_fix:
    lacena: alacena
    elevado: elevada
    revisa: revisé

overlays:
